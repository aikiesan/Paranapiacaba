name: Deploy WebGIS to GitHub Pages

on:
  push:
    branches:
      - main
  # Permite republicar o site manualmente pela aba Actions.
  workflow_dispatch:

# Permissões exigidas pelo deploy oficial do GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; execuções em fila são descartadas em favor da mais
# recente, mas o deploy em andamento nunca é cancelado no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build 🏗️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 🔧
        run: npm ci

      # Barreira de qualidade: um catálogo de camadas quebrado não vai ao ar.
      - name: Run tests 🧪
        run: npm test

      - name: Build project 🏗️
        run: npm run build

      - name: Configure Pages ⚙️
        uses: actions/configure-pages@v5

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy 🚀
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
