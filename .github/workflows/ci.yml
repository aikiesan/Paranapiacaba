name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Um PR que recebe vários pushes só precisa validar o commit mais recente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build 🧪
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 🔧
        run: npm ci

      - name: Run tests 🧪
        run: npm test

      # Garante que o mesmo build publicado no Pages compila a partir do PR.
      - name: Build project 🏗️
        run: npm run build
